[project]
name = "todoapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "nicegui>=3.14.0",
    "pywebview>=6.2.1",
    "httpx>=0.27.0",
]

[project.scripts]
todoapp = "todoapp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todoapp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
]

[tool.mypy]
python_version = "3.13"
strict = true

# NiceGUI公式exampleを無改変でベンダリングしたコード。upstreamとの差分を保つため型注釈を追加しない
[[tool.mypy.overrides]]
module = "todoapp.ui.vendor.fullcalendar.fullcalendar"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["test"]
